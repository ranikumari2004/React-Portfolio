<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />

    <!-- Title (VERY IMPORTANT for SEO) -->
    <title>Rani Kumari | MERN Stack Developer Portfolio | React, Node.js, MongoDB</title>

    <!-- Description -->
    <meta
      name="description"
      content="Rani Kumari is a MERN Stack Developer specializing in React, Node.js, MongoDB, and modern web applications. Explore projects, skills, and professional experience."
    />

    <!-- Keywords -->
    <meta
      name="keywords"
      content="Rani Kumari, MERN Stack Developer, React Developer, Node.js Developer, Full Stack Developer, Web Developer Portfolio, JavaScript Developer, India"
    />

    <!-- Author -->
    <meta name="author" content="Rani Kumari" />

    <!-- Open Graph (for Google, LinkedIn, WhatsApp) -->
    <meta property="og:title" content="Rani Kumari | MERN Stack Developer Portfolio" />
    <meta
      property="og:description"
      content="Professional MERN Stack Developer portfolio showcasing projects, skills, and experience in React, Node.js, and MongoDB."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-domain.vercel.app" />
    <meta property="og:image" content="/seo-preview.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rani Kumari | MERN Stack Developer Portfolio" />
    <meta
      name="twitter:description"
      content="Explore my professional portfolio built with React, Node.js, and MongoDB."
    />
    <meta name="twitter:image" content="/seo-preview.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://your-domain.vercel.app" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
